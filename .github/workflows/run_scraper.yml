name: Jalankan Divisi Scraper YouTube

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: 'Tempel Link YouTube Disini'
        required: true
        default: 'https://www.youtube.com/@Nostalgiback/shorts'
        type: string
      max_count:
        description: 'Jumlah max (kosongkan jika ingin semua)'
        required: false
        default: '10'
        type: string

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ambil Kode dari Gudang
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal Pustaka yt-dlp
        run: |
          pip install yt-dlp

      - name: Jalankan Mesin Scraper dengan Limit
        run: |
          python -c "
          from scrape_shorts import scrape_youtube_shorts
          target = '${{ github.event.inputs.channel_url }}'
          limit_val = '${{ github.event.inputs.max_count }}'
          limit_num = int(limit_val) if limit_val.strip() else 0
          scrape_youtube_shorts(target, limit_num)
          "

      - name: Simpan Hasil File CSV Otomatis
        run: |
          git config --global user.name "Bot Perusahaan"
          git config --global user.email "bot@berkahistiqomah.com"
          git add data_youtube_shorts.csv
          git commit -m "Update hasil scrape data shorts terbaru" || echo "Tidak ada perubahan data"
          git push

      - name: Kirim Data ke Divisi Download
        env:
          TOKEN_RAHASIA: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bot Perusahaan"
          git config --global user.email "bot@berkahistiqomah.com"
          git clone https://x-access-token:${TOKEN_RAHASIA}@github.com/agusaliariyantii-ops/divisi-download.git temp_download
          cp data_youtube_shorts.csv temp_download/
          cd temp_download
          git add data_youtube_shorts.csv
          git commit -m "Terima data CSV baru dari Divisi Scraper YouTube" || echo "Tidak ada perubahan data"
          git push
